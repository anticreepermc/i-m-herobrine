name: Build MultiLoader Mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: 1.21.7
            loader: forge
            project_loader: forge
          - minecraft: 1.21.7
            loader: fabric
            project_loader: fabric
          - minecraft: 1.21.7
            loader: neoforge
            project_loader: neoforge
          - minecraft: 1.21.7
            loader: quilt
            project_loader: fabric
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Stonecutter loader projects
        run: ./gradlew --no-daemon --stacktrace :${{ matrix.minecraft }}-${{ matrix.project_loader }}:build

      - name: Prepare loader artifacts
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep '^mod.version' stonecutter.properties.toml | cut -d'"' -f2)
          mkdir -p "artifacts/${{ matrix.loader }}"
          jar=$(find "${{ matrix.minecraft }}-${{ matrix.project_loader }}/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)
          test -n "$jar"
          if [ "${{ matrix.loader }}" = "quilt" ]; then
            cp "$jar" "artifacts/quilt/imherobrine-${version}-mc${{ matrix.minecraft }}-quilt.jar"
          else
            cp "$jar" "artifacts/${{ matrix.loader }}/"
          fi

      - name: Upload loader artifact
        uses: actions/upload-artifact@v4
        with:
          name: imherobrine-${{ matrix.loader }}-${{ matrix.minecraft }}
          path: artifacts/${{ matrix.loader }}/*.jar
          if-no-files-found: error
